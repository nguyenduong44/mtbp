name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép chạy thủ công từ GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Build trên VPS để tránh vấn đề native modules (sharp)
          # public/uploads/ không bị xóa vì nằm trong .gitignore
          script: |
            set -e  # dừng ngay nếu bất kỳ lệnh nào fail

            cd /var/www/mtbp-agency

            echo "=== Pull code mới ==="
            git pull origin main

            echo "=== Cài dependencies ==="
            npm ci

            echo "=== Build production ==="
            npm run build

            pm2 stop mtbp || true

          # Khởi động lại với ecosystem (tự động đọc biến từ .env)
            pm2 start ecosystem.config.cjs --update-env

            pm2 save
            echo "=== Kiểm tra trạng thái ==="
            pm2 show mtbp

            echo "=== Deploy thành công ==="
